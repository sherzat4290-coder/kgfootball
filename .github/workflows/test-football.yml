name: Футбол постун даярдоо

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Матчты алып, пост даярдоо
        env:
          API_KEY: ${{ secrets.API_NINJAS_KEY }}
        run: |
          curl -fsS \
            -H "X-Api-Key: $API_KEY" \
            "https://api.api-ninjas.com/v1/soccermatches?league=ucl" \
            -o matches.json

          python3 - <<'PY'
          import json

          with open("matches.json", encoding="utf-8") as f:
              matches = json.load(f)

          if not matches:
              print("Азырынча матч табылган жок.")
          else:
              match = matches[0]
              home = match.get("home_team") or {}
              away = match.get("away_team") or {}
              home_name = home.get("name", "Команда 1")
              away_name = away.get("name", "Команда 2")
              date = match.get("date", "Дата көрсөтүлгөн эмес")
              status = match.get("status", "")

              print("⚽ ЧЕМПИОНДОР ЛИГАСЫ")
              print(f"🔥 {home_name} — {away_name}")
              print(f"📅 Дата: {date}")

              if status == "final":
                  print(f"🏁 Эсеп: {match.get('home_score')} : {match.get('away_score')}")
              elif status == "in_progress":
                  print("🔴 Беттеш жүрүп жатат!")
              elif status == "scheduled":
                  print("⏳ Беттеш алдыда!")
              else:
                  print(f"ℹ️ Статус: {status or 'белгисиз'}")

              print("#футбол #чемпиондорлигасы #kgfootballtv")
          PY
