name: Матчтарды жаңылоо

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: API'ден матчтарды алуу
        env:
          API_KEY: ${{ secrets.API_NINJAS_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          key = os.environ.get("API_KEY")
          if not key:
              raise SystemExit("API_NINJAS_KEY табылган жок")

          leagues = ["ucl", "epl", "laliga"]
          matches = []

          for league in leagues:
              url = (
                  "https://api.api-ninjas.com/v1/"
                  "soccermatches?league=" + league
              )
              request = urllib.request.Request(
                  url, headers={"X-Api-Key": key}
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
                  if isinstance(data, list):
                      matches.extend(data)
                  print(league + ": " + str(len(data)) + " матч")
              except Exception as error:
                  print(league + ": ката: " + str(error))

          if not matches:
              raise SystemExit(
                  "Матч табылган жок. Мурунку файл өзгөртүлгөн жок."
              )

          with open("matches.json", "w", encoding="utf-8") as file:
              json.dump(matches, file, ensure_ascii=False, indent=2)
          PY

      - name: Маалыматты сактоо
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          if git diff --cached --quiet; then
            echo "Өзгөрүү жок"
          else
            git commit -m "Матчтарды жаңылоо"
            git push
          fi